name: Deploy mdBook to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  MDBOOK_VERSION: v0.5.4
  MDBOOK_MERMAID_VERSION: 0.17.1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refuse to deploy stale commits
        run: |
          latest="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo "::error::$GITHUB_SHA is not the tip of main ($latest); refusing to deploy an outdated build."
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install mdBook ${{ env.MDBOOK_VERSION }}
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL --retry 3 --retry-delay 2 \
            "https://github.com/rust-lang/mdBook/releases/download/${MDBOOK_VERSION}/mdbook-${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz --directory "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/mdbook" --version

      - name: Restore Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-mdbook-mermaid-${{ env.MDBOOK_MERMAID_VERSION }}
          restore-keys: |
            ${{ runner.os }}-cargo-mdbook-mermaid-

      - name: Install mdbook-mermaid ${{ env.MDBOOK_MERMAID_VERSION }}
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          if ! command -v mdbook-mermaid >/dev/null 2>&1; then
            cargo install mdbook-mermaid --version "${MDBOOK_MERMAID_VERSION}" --locked
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build book
        run: mdbook build

      - name: Verify Mermaid preprocessing
        run: |
          if ! grep -Rqs 'class="mermaid"' book; then
            echo "::error::No rendered Mermaid blocks found in book/; the mdbook-mermaid preprocessor did not run."
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./book

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
